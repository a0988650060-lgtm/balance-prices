<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>資產負債表</title>
<style>
:root{--bg:#f6f4ee;--card:#fffdf8;--ink:#1f2a24;--mute:#6b756e;--line:#d9d4c5;--acc:#1f5d46;--accink:#fff;--red:#c0492f;--inp:#fff;--c1:#1f5d46;--c2:#c98a1b;--c3:#8a5a9b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101311;--card:#181d1a;--ink:#e8ece8;--mute:#98a39b;--line:#2e3631;--acc:#6bcf9f;--accink:#0d2018;--red:#ff8d73;--inp:#121714;--c1:#6bcf9f;--c2:#e0a93f;--c3:#c195d1}}
:root[data-theme="dark"]{--bg:#101311;--card:#181d1a;--ink:#e8ece8;--mute:#98a39b;--line:#2e3631;--acc:#6bcf9f;--accink:#0d2018;--red:#ff8d73;--inp:#121714;--c1:#6bcf9f;--c2:#e0a93f;--c3:#c195d1}
:root{--up:#d6453d;--dn:#1e8a54}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--up:#ff6b61;--dn:#4cd08a}}:root[data-theme="dark"]{--up:#ff6b61;--dn:#4cd08a}
.up{color:var(--up)}.dn{color:var(--dn)}
.tpl{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0 8px;font-size:15px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
input{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
button{font:inherit;cursor:pointer}
small{display:block;color:var(--mute);font-size:12px}
.navlink{display:block;text-align:right;font-size:14px;font-weight:600;color:var(--acc);text-decoration:none;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.pd{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}.pd input{width:auto}
.addwrap{position:relative}
.addbtn{background:var(--acc);color:var(--accink);border:0;border-radius:12px;padding:10px 14px;font-weight:700}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:5;width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.menu[hidden]{display:none}
.menu p{margin:0 0 4px;font-size:13px;color:var(--mute)}
.menu button{display:block;width:100%;text-align:left;margin-top:6px;padding:10px;border-radius:10px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.card h2 span{color:var(--mute);font-weight:500;font-size:14px}
.net{font-size:28px;font-weight:700;margin:2px 0 10px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.row{border-top:1px dashed var(--line);padding:10px 0}
.row.two{display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;align-items:center}
.row.head{border-top:0;padding:0 0 2px;font-size:12px;color:var(--mute)}
.st-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.code{width:140px;flex:none}
.nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm.bad{color:var(--red);font-weight:400;font-size:13px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
label{display:block;font-size:12px;color:var(--mute)}
.der,.dl{font-size:13px;color:var(--mute);margin-top:6px}
.dl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.del{background:none;border:0;font-size:18px;color:var(--red);padding:4px}
.empty{text-align:center;color:var(--mute);padding:10px 0 2px;font-size:14px}
.pos{color:var(--acc)}.neg{color:var(--red)}
.snap{width:100%;padding:11px;border-radius:12px;border:0;background:var(--acc);color:var(--accink);font-weight:700;margin:4px 0 8px}
.hist{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.mute{color:var(--mute);font-size:13px;margin:4px 0}
.foot{font-size:12px;color:var(--mute);text-align:center;margin:8px 0 24px}
.auth{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.auth button{padding:5px 10px;border-radius:8px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-weight:600}
</style>
</head>
<body>
<main>
<a class="navlink" href="monthly.html">每月收支紀錄 →</a>
<div class="top">
  <label class="pd">股價日期 <input type="date" id="pd"></label>
  <div class="addwrap"><button class="addbtn" id="addbtn">＋ 新增項目</button><div class="menu" id="menu" hidden><p>請選擇要新增的項目類別</p></div></div>
</div>
<div class="card">
  <small>淨值（總資產 − 總負債）</small><div class="net" id="net">NT$ 0</div>
  <div class="two2"><div><small>總資產</small><b id="ta">NT$ 0</b></div><div><small>總負債</small><b id="tl">NT$ 0</b></div></div>
  <div class="bar" id="bar"></div><div class="legend" id="legend"></div>
</div>
<div id="secs"></div>
<div class="card">
  <h2>每月快照</h2>
  <button class="snap" id="snapBtn">記錄本月快照</button>
  <div id="trend"></div>
  <div class="mute" id="nextup"></div>
  <ul class="hist" id="hist"></ul>
</div>
<div class="foot"><div class="auth" id="auth"></div></div>
</main>
<script>
var PRICE_URL='https://raw.githubusercontent.com/gaway1228-lgtm/balance-prices/main/prices.json';
var KEY='balance-sheet-v2',PRICES=null,priceErr=false;
function $(i){return document.getElementById(i)}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e}
function fmt(n){return 'NT$ '+Math.round(n).toLocaleString('zh-TW')}
function nf(v){return v?Number(v).toLocaleString('en-US',{maximumFractionDigits:6}):''}
function norm(o){
 var d={banks:[],stocks:[],property:[],loans:[],snaps:[],pd:''};o=o||{};
 ['banks','property','loans','snaps'].forEach(function(k){if(Array.isArray(o[k]))d[k]=o[k]});
 if(o.pd)d.pd=o.pd;
 (o.stocks||[]).concat(o.etfs||[]).forEach(function(x){
  if(x.k===undefined){var m=String(x.n||'').trim().match(/^([0-9A-Za-z]+)\s*(.*)$/);x={k:m?m[1]:'',n:m?m[2]:'',s:x.s||0,c:x.c||0,p:x.p||0}}
  d.stocks.push(x)});
 return d}
function load(){try{var x=localStorage.getItem(KEY)||localStorage.getItem('balance-sheet-v1');if(x)return norm(JSON.parse(x))}catch(e){}return norm()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.cloudSave)window.cloudSave(S)}
var S=load();
var cfg=[['banks','🏛️','銀行存款'],['stocks','📈','股票'],['property','🏠','房產'],['loans','💳','房貸']];
var blank={banks:{n:'',b:0},stocks:{k:'',n:'',s:0,c:0,p:0},property:{n:'',b:0},loans:{n:'',b:0,r:0,m:0,d:''}};
function val(k,x){return k==='stocks'?x.s*x.p:x.b}
function sub(k){return S[k].reduce(function(a,x){return a+val(k,x)},0)}
function derived(k,x){
 if(k==='stocks'){var mv=x.s*x.p,pl=mv-x.s*x.c;return '市值 '+fmt(mv)+'　<span class="'+(pl>=0?'up':'dn')+'">損益 '+(pl>=0?'+':'')+fmt(pl)+'</span>'}
 var i=x.b*x.r/100/12;return '每月利息約 '+fmt(i)+'，本金約 '+fmt(Math.max(x.m-i,0))}
function txtIn(x,key,ph){var i=el('input');i.type='text';i.placeholder=ph||'';i.value=x[key]||'';i.oninput=function(){x[key]=i.value;save()};return i}
function numIn(x,key,ph,cb){
 var i=el('input');i.type='text';i.inputMode='decimal';i.placeholder=ph||'';i.value=nf(x[key]);
 i.onfocus=function(){i.value=x[key]||''};i.onblur=function(){i.value=nf(x[key])};
 i.oninput=function(){x[key]=parseFloat(i.value.replace(/,/g,''))||0;save();cb()};return i}
function fld(t,i){var l=el('label','',t);l.appendChild(i);return l}
function trash(k,i){var b=el('button','del','🗑️');b.setAttribute('aria-label','刪除');b.onclick=function(){S[k].splice(i,1);save();render()};return b}
function look(x,nm,pEl){
 var c=(x.k||'').toUpperCase();nm.className='nm';
 if(c.length<4){nm.textContent='';return}
 if(!PRICES){nm.textContent=priceErr?'無法取得股價，請手動輸入現價':'股價資料載入中…';return}
 var p=PRICES.prices[c],n=PRICES.names[c];
 if(p||n){x.n=n||x.n||'';nm.textContent=x.n;if(p){x.p=p;pEl.value=nf(p)}S.pd=PRICES.tradeDate||PRICES.updated;$('pd').value=S.pd}
 else{x.n='';nm.textContent='查無此代碼';nm.className='nm bad'}}
function row(k,x,i){
 var r,g,upd;
 if(k==='banks'||k==='property'){
  r=el('div','row two');r.appendChild(txtIn(x,'n',k==='banks'?'例：台北富邦':'例：自住房'));r.appendChild(numIn(x,'b','0',totals));r.appendChild(trash(k,i));return r}
 if(k==='stocks'){
  r=el('div','row');var top=el('div','st-top'),nm=el('span','nm',''),pEl,der=el('div','der',derived(k,x));
  nm.textContent=x.n||'';
  var code=el('input','code');code.type='text';code.placeholder='代碼，例：0050';code.value=x.k||'';
  upd=function(){der.innerHTML=derived(k,x);totals()};
  code.oninput=function(){x.k=code.value.trim();look(x,nm,pEl);save();upd()};
  top.appendChild(code);top.appendChild(nm);top.appendChild(trash(k,i));
  g=el('div','g3');pEl=numIn(x,'p','自動帶入',upd);
  g.appendChild(fld('股數',numIn(x,'s','0',upd)));g.appendChild(fld('成本價',numIn(x,'c','0',upd)));g.appendChild(fld('現價',pEl));
  r.appendChild(top);r.appendChild(g);r.appendChild(der);return r}
 r=el('div','row');r.appendChild(fld('貸款名稱',txtIn(x,'n','例：合作金庫')));
 var ln=el('div','dl'),sp=el('span','',derived(k,x));ln.appendChild(sp);ln.appendChild(trash(k,i));
 upd=function(){sp.innerHTML=derived(k,x);totals()};
 g=el('div','g2');
 g.appendChild(fld('剩餘本金',numIn(x,'b','0',upd)));g.appendChild(fld('年利率 %',numIn(x,'r','0',upd)));
 g.appendChild(fld('每月還款額',numIn(x,'m','0',upd)));
 var mi=el('input');mi.type='month';mi.value=x.d||'';mi.oninput=function(){x.d=mi.value;save()};g.appendChild(fld('到期年月',mi));
 r.appendChild(g);r.appendChild(ln);return r}
function render(){
 var root=$('secs');root.innerHTML='';
 cfg.forEach(function(c){
  var k=c[0],sec=el('div','card');sec.id='sec-'+k;
  sec.appendChild(el('h2','',c[2]+'<span id="sub-'+k+'"></span>'));
  if(k==='stocks')sec.appendChild(el('div','tpl','<span>總損益</span><b id="stpl"></b>'));
  if((k==='banks'||k==='property')&&S[k].length)sec.appendChild(el('div','row two head','<span>'+(k==='banks'?'銀行／帳戶名稱':'房產名稱')+'</span><span>'+(k==='banks'?'存款金額':'目前市值')+'</span><span></span>'));
  if(!S[k].length)sec.appendChild(el('div','empty','目前無項目，請點擊右上角新增'));
  S[k].forEach(function(x,i){sec.appendChild(row(k,x,i))});
  root.appendChild(sec)});
 totals()}
function totals(){
 var b=sub('banks'),st=sub('stocks'),pr=sub('property'),ta=b+st+pr,tl=sub('loans');
 cfg.forEach(function(c){var e=$('sub-'+c[0]);if(e)e.textContent='小計 '+fmt(sub(c[0]))});
 $('ta').textContent=fmt(ta);$('tl').textContent=fmt(tl);$('net').textContent=fmt(ta-tl);
 var bar=$('bar'),lg=$('legend');bar.innerHTML='';lg.innerHTML='';
 [['存款',b,'--c1'],['股票',st,'--c2'],['房產',pr,'--c3']].forEach(function(it){
  var p=ta>0?it[1]/ta*100:0,s=el('div');s.style.cssText='width:'+p+'%;background:var('+it[2]+')';bar.appendChild(s);
  lg.appendChild(el('span','','<i class="dot" style="background:var('+it[2]+')"></i>'+it[0]+' '+p.toFixed(1)+'%'))});
 var sp=$('stpl');
 if(sp){var cost=S.stocks.reduce(function(a,x){return a+x.s*x.c},0),pl=st-cost;
  sp.parentNode.style.display=S.stocks.length?'':'none';sp.className=pl>=0?'up':'dn';
  sp.textContent=(pl>=0?'+':'')+fmt(pl)+(cost>0?'（'+(pl>=0?'+':'')+(pl/cost*100).toFixed(2)+'%）':'')}
 window._cur={ta:ta,tl:tl,net:ta-tl,bank:b,stock:st,prop:pr}}
function addItem(k){
 S[k].push(JSON.parse(JSON.stringify(blank[k])));save();render();
 var rows=document.querySelectorAll('#sec-'+k+' .row:not(.head)'),r=rows[rows.length-1];
 if(r){r.scrollIntoView({behavior:'smooth',block:'center'});var i=r.querySelector('input');if(i)i.focus()}}
function banner(){
 var n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),n.getDate()),t=new Date(n.getFullYear(),n.getMonth(),10);
 var ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'),done=S.snaps.some(function(s){return s.m===ym});
 if(d>t)t=new Date(n.getFullYear(),n.getMonth()+1,10);
 var days=Math.round((t-d)/864e5);
 $('nextup').textContent=(n.getDate()>=10&&!done)?'已過 10 日，本月快照尚未記錄。':'下次更新日：'+(t.getMonth()+1)+'/10（'+(days===0?'就是今天':'還有 '+days+' 天')+'）'+(done?'，本月快照已記錄。':'。')}
function snaps(){
 var s=S.snaps.slice().sort(function(a,b){return a.m<b.m?-1:1}).slice(-12),tr=$('trend'),h=$('hist');h.innerHTML='';
 if(s.length<2){tr.innerHTML='<p class="mute">至少記錄兩個月後，這裡會顯示淨值趨勢。</p>'}
 else{
  var v=s.map(function(x){return x.net}),mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),r=mx-mn||1,W=320,H=100,P=8;
  var pts=s.map(function(x,i){return [P+i*(W-2*P)/(s.length-1),H-P-(x.net-mn)/r*(H-2*P)]});
  tr.innerHTML='<svg viewBox="0 0 320 100" width="100%" role="img" aria-label="淨值趨勢"><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="'+pts.map(function(p){return p.join(',')}).join(' ')+'"/>'+pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="var(--acc)"/>'}).join('')+'</svg>'}
 s.slice().reverse().forEach(function(x,i,arr){
  var pv=arr[i+1],ch=pv?x.net-pv.net:null;
  h.appendChild(el('li','','<span>'+x.m+'</span><span>'+fmt(x.net)+(ch===null?'':' <span class="'+(ch>=0?'up':'dn')+'">'+(ch>=0?'+':'')+fmt(ch)+'</span>')+'</span>'))})}
function loadPrices(){
 if(!PRICE_URL)return;
 fetch(PRICE_URL,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
  d.names=d.names||{};PRICES=d;var hit=false;
  S.stocks.forEach(function(x){var c=(x.k||'').trim().toUpperCase();if(!c)return;if(d.prices[c]){x.p=d.prices[c];hit=true}if(d.names[c])x.n=d.names[c]});
  if(hit){S.pd=d.tradeDate||d.updated;$('pd').value=S.pd}
  save();render()
 }).catch(function(){priceErr=true;render()})}
var menu=$('menu');
cfg.forEach(function(c){var b=el('button','',c[1]+' '+c[2]);b.onclick=function(){menu.hidden=true;addItem(c[0])};menu.appendChild(b)});
$('addbtn').onclick=function(e){e.stopPropagation();menu.hidden=!menu.hidden};
document.addEventListener('click',function(e){if(!e.target.closest('.addwrap'))menu.hidden=true});
$('pd').value=S.pd||'';$('pd').oninput=function(){S.pd=this.value;save()};
$('snapBtn').onclick=function(){
 var n=new Date(),ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
 S.snaps=S.snaps.filter(function(s){return s.m!==ym});var h={};S.stocks.forEach(function(x){var c=(x.k||'').trim().toUpperCase();if(c&&x.s)h[c]=(h[c]||0)+x.s});
 S.snaps.push(Object.assign({m:ym},window._cur,{h:h}));save();snaps();banner()};
render();snaps();banner();loadPrices();
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAdMXfySJepv12l3ZAepDxP-g37R5t8He8',authDomain:'assets-71c12.firebaseapp.com',projectId:'assets-71c12',appId:'1:1017180277341:web:6b1538bca7f3b4b922dbb4'};
const bar=document.getElementById('auth');
function btn(t,f){const b=document.createElement('button');b.textContent=t;b.onclick=f;bar.appendChild(b)}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let ref=null,timer=null;
window.cloudSave=function(s){
 if(!ref)return;clearTimeout(timer);
 timer=setTimeout(function(){setDoc(ref,{json:JSON.stringify(s),updated:Date.now()}).catch(function(){bar.textContent='雲端同步失敗，資料已先存在這台裝置。'})},800)};
onAuthStateChanged(auth,async function(u){
 bar.textContent='';
 if(!u){ref=null;bar.append('資料只存在這台裝置。');btn('用 Google 登入同步',function(){signInWithPopup(auth,new GoogleAuthProvider()).catch(function(){})});return}
 ref=doc(db,'users',u.uid,'data','balance');
 try{
  const snap=await getDoc(ref);
  if(snap.exists()){window.S=norm(JSON.parse(snap.data().json));document.getElementById('pd').value=window.S.pd||'';render();snaps();banner();loadPrices()}
  else{await setDoc(ref,{json:JSON.stringify(window.S),updated:Date.now()})}
  bar.append('已同步：'+u.email+'　');btn('登出',function(){signOut(auth)})
 }catch(e){ref=null;bar.append('讀取雲端資料失敗，請確認 Firestore 規則已發布。')}
});
</script>
</body>
</html>
